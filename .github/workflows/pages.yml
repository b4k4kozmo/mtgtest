# Publish the backend-free build to GitHub Pages.
#
# The result is the full app on a public URL: every card Scryfall knows about,
# including the newest sets, priced from its daily TCGplayer and Cardmarket
# feed. No server, because Scryfall allows cross-origin reads straight from the
# browser.
#
# Pages is switched on by the configure-pages step below, so there is no manual
# setup: the first successful run publishes the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/magic-card-price-search-g2ab3w']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:static
      - uses: actions/configure-pages@v5
        # Turns Pages on for the repo if it is not already, so a fresh clone of
        # this project deploys without anyone visiting the settings page.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
