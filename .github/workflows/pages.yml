# Publish the backend-free build to GitHub Pages.
#
# The result is the full app on a public URL: every card Scryfall knows about,
# including the newest sets, priced from its daily TCGplayer and Cardmarket
# feed. No server, because Scryfall allows cross-origin reads straight from the
# browser.
#
# ONE-TIME SETUP: repository Settings -> Pages -> Source: "GitHub Actions".
# The workflow cannot do this for you. Actions' built-in GITHUB_TOKEN can deploy
# to an existing Pages site but is not allowed to create one, so
# `configure-pages` with `enablement: true` fails with "Resource not accessible
# by integration". Flipping that one setting is the whole setup.
#
# Until then the build job still runs green — tests and the static build are
# independent of Pages — and only `deploy` goes red.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/magic-card-price-search-g2ab3w']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:static
      # No `configure-pages` here: its only job is handing a base path to site
      # generators, and this build uses relative paths so it works from any
      # subpath already. Keeping it out of this job means a Pages misconfiguration
      # cannot mask a genuine test or build failure.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
